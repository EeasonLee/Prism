version: '3.8'

services:
  jd-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jd-frontend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://192.168.50.4:1337
      - STRAPI_URL=http://192.168.50.4:1337
    restart: unless-stopped
    networks:
      - app-network

  jd-frontend-dev:
    image: node:22-alpine
    container_name: jd-frontend-dev
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile && pnpm nx dev jd-frontend --host 0.0.0.0 --port 4000"
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://192.168.50.4:4000
      - NEXT_PUBLIC_API_URL=http://192.168.50.4:1337
      - STRAPI_URL=http://192.168.50.4:1337
      - NEXT_PUBLIC_IMAGE_BASE_URL=http://192.168.50.4:1337
      - NEXT_PUBLIC_MAGENTO_API_URL=http://192.168.50.4:13000
      - NEXT_PUBLIC_LOG_LEVEL=debug
      - NEXT_PUBLIC_USE_API_PROXY=true
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    external: true
